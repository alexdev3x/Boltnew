# XcodeGen spec for FreeMilk. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate
name: FreeMilk
options:
  bundleIdPrefix: ai.freemilk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  FreeMilk:
    type: application
    platform: iOS
    sources:
      - FreeMilk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.freemilk.app
        PRODUCT_NAME: FreeMilk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"

  FreeMilkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FreeMilkTests
    dependencies:
      - target: FreeMilk
